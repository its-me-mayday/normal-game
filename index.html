<!DOCTYPE html>
<html lang="it">
<head>

<style>
html,body{margin:0;height:100%;background:#07090c;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;touch-action:none}

<body>
<canvas id="c"></canvas>
<script>
'use strict';
// =====================================================================
//  NORMAL GAME — una giornata assolutamente normale in ufficio
// =====================================================================
const C=document.getElementById('c'),X=C.getContext('2d');
let W=960,H=720,SC=1,OX=0,OY=0,DPR=1,TIME=0;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);const vw=innerWidth,vh=innerHeight;C.width=Math.round(vw*DPR);C.height=Math.round(vh*DPR);C.style.width=vw+'px';C.style.height=vh+'px';H=720;W=Math.round(Math.max(380,Math.min(1440,H*vw/vh)));SC=Math.min(C.width/W,C.height/H);OX=(C.width-W*SC)/2;OY=(C.height-H*SC)/2;}
addEventListener('resize',resize);resize();

// ---------- utils
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,rnd=(a,b)=>a+Math.random()*(b-a),ri=(a,b)=>Math.floor(rnd(a,b+1)),pick=a=>a[Math.floor(Math.random()*a.length)];
const E={oc:t=>1-Math.pow(1-t,3),io:t=>-(Math.cos(Math.PI*t)-1)/2,ob:t=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)},ic:t=>t*t*t};
const damp=(a,b,k,dt)=>lerp(a,b,1-Math.exp(-k*dt));
function fmt(m){m=Math.floor(m);const h=Math.floor(m/60)%24,mm=((m%60)+60)%60;return String(h).padStart(2,'0')+':'+String(mm).padStart(2,'0')}
const _hc=new Map();function hx(h){let v=_hc.get(h);if(!v){const n=parseInt(h.slice(1),16);v=[n>>16,(n>>8)&255,n&255];_hc.set(h,v)}return v}
function mix(a,b,t){const A=hx(a),B=hx(b);return `rgb(${A[0]+(B[0]-A[0])*t|0},${A[1]+(B[1]-A[1])*t|0},${A[2]+(B[2]-A[2])*t|0})`}
const _sc=new Map();function shade(h,a){const k=h+a;let v=_sc.get(k);if(!v){const c=hx(h).map(x=>a<0?x*(1+a):x+(255-x)*a);v=`rgb(${c[0]|0},${c[1]|0},${c[2]|0})`;_sc.set(k,v)}return v}
function rr(x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));X.beginPath();X.moveTo(x+r,y);X.arcTo(x+w,y,x+w,y+h,r);X.arcTo(x+w,y+h,x,y+h,r);X.arcTo(x,y+h,x,y,r);X.arcTo(x,y,x+w,y,r);X.closePath()}
function frr(x,y,w,h,r,c){rr(x,y,w,h,r);X.fillStyle=c;X.fill()}
function ell(x,y,rx,ry,c){X.beginPath();X.ellipse(x,y,Math.max(.01,rx),Math.max(.01,ry),0,0,Math.PI*2);X.fillStyle=c;X.fill()}
function line(x1,y1,x2,y2,c,w){X.beginPath();X.moveTo(x1,y1);X.lineTo(x2,y2);X.strokeStyle=c;X.lineWidth=w;X.lineCap='round';X.stroke()}
const IS_FINE=!!(window.matchMedia&&matchMedia('(pointer:fine)').matches);
const FONT='ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,-apple-system,sans-serif';
function T(s,x,y,sz,col,al='center',wt=800,bl='middle'){X.font=`${wt} ${sz}px ${FONT}`;X.fillStyle=col;X.textAlign=al;X.textBaseline=bl;X.fillText(s,x,y)}
function TW(s,sz,wt=800){X.font=`${wt} ${sz}px ${FONT}`;return X.measureText(s).width}
function wrap(s,maxW,sz,wt=700){X.font=`${wt} ${sz}px ${FONT}`;const out=[];for(const para of String(s).split('\n')){let cur='';for(const w of para.split(' ')){const t=cur?cur+' '+w:w;if(X.measureText(t).width>maxW&&cur){out.push(cur);cur=w}else cur=t}out.push(cur)}return out}
function quad(a,b,c,d,col){X.beginPath();X.moveTo(a.x,a.y);X.lineTo(b.x,b.y);X.lineTo(c.x,c.y);X.lineTo(d.x,d.y);X.closePath();X.fillStyle=col;X.fill()}

// ---------- audio (sintetizzato)
let AC=null,MUTE=false,MST=null,NB=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();MST=AC.createGain();MST.gain.value=.55;MST.connect(AC.destination);MUSG=AC.createGain();MUSG.gain.value=.5;MUSG.connect(MST);NB=AC.createBuffer(1,AC.sampleRate*.5,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}catch(e){AC=null}}if(AC&&AC.state==='suspended')AC.resume().catch(()=>{});return AC}
function tone(f,d=.1,type='sine',v=.07,f2=0,delay=0){if(MUTE)return;const a=ac();if(!a)return;const t=a.currentTime+delay,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(MST);o.start(t);o.stop(t+d+.03)}
function noise(d=.05,v=.06,fr=2000,type='highpass',delay=0){if(MUTE)return;const a=ac();if(!a)return;const t=a.currentTime+delay,s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();s.buffer=NB;f.type=type;f.frequency.value=fr;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(g);g.connect(MST);s.start(t,Math.random()*.3);s.stop(t+d+.02)}
// ---------- musica (sequencer sintetizzato)
const _=null;let MUSG=null,MUSV=-1;const MUS={name:null,t:0,step:0};
const CH={M7:[0,4,7,11],m7:[0,3,7,10],d7:[0,4,7,10],M:[0,4,7],m:[0,3,7]};
const SONGS={
 title:{bpm:116,ch:[[48,'M'],[45,'m'],[41,'M'],[43,'M']],lead:'square',lv:.035,pv:.02,mel:[3,_,4,_,5,_,4,_,3,_,2,_,4,_,_,_,5,_,4,_,3,4,5,_,6,_,5,_,4,_,_,_],bass:'x...x.x.x...x.x.',dr:{k:'x...x...x...x...',s:'....x.......x...',h:'x.x.x.x.x.x.x.x.'}},
 office:{bpm:84,swing:.14,ch:[[41,'M7'],[40,'m7'],[38,'m7'],[36,'M7']],lead:'triangle',lv:.05,pad:'sine',pv:.03,ml:2.5,mel:[_,_,4,_,_,6,_,5,_,_,_,_,4,_,3,_,_,_,5,_,_,7,6,_,5,_,_,_,_,_,_,_],bass:'x.....x...x.....',dr:{k:'x.......x.x.....',s:'....x.......x...',h:'..x...x...x...x.'}},
 ladder:{bpm:150,ch:[[45,'m'],[41,'M'],[48,'M'],[43,'M']],lead:'square',lv:.04,pv:.012,ml:.9,mel:[3,4,5,4,3,4,5,6,5,4,3,_,5,_,6,_,6,5,4,5,6,_,7,_,6,5,4,3,2,_,3,_],bass:'x.x.x.x.x.x.x.x.',dr:{k:'x...x...x...x...',s:'....x.......x..x',h:'xxxxxxxxxxxxxxxx'}},
 run:{bpm:164,ch:[[48,'M'],[43,'M'],[45,'m'],[41,'M']],lead:'square',lv:.04,pv:.012,ml:.9,mel:[3,_,3,4,5,_,3,_,6,_,5,_,4,_,3,_,4,_,4,5,6,_,4,_,7,_,6,_,5,4,3,_],bass:'x.xxx.xxx.xxx.xx',dr:{k:'x.x.x.x.x.x.x.x.',s:'....x.......x...',h:'xxxxxxxxxxxxxxxx'}},
 mensa:{bpm:104,swing:.2,walk:1,ch:[[38,'m7'],[43,'d7'],[36,'M7'],[45,'d7']],lead:'triangle',lv:.05,pad:'sine',pv:.025,ml:1.8,mel:[4,_,5,6,_,5,4,_,2,_,_,3,_,_,_,_,5,_,6,7,_,6,5,_,4,_,_,_,_,_,_,_],bass:'x.x.x.x.x.x.x.x.',dr:{k:'x.......x.......',s:'',h:'x..xx..xx..xx..x'}},
 sneak:{bpm:96,ch:[[45,'m'],[45,'m'],[41,'M'],[40,'M']],lead:'triangle',lv:.06,pv:.012,ml:.6,mel:[0,_,_,2,_,_,1,_,0,_,_,_,_,_,_,_,3,_,_,2,_,_,1,_,0,_,_,_,_,_,_,_],bass:'x...x...x...x...',dr:{k:'x.......x.......',s:'',h:'....x.......x...'}},
 win:{bpm:128,ch:[[48,'M'],[41,'M'],[43,'M'],[48,'M']],lead:'square',lv:.04,pv:.02,mel:[3,4,5,_,6,_,5,_,4,5,6,_,7,_,_,_,6,5,4,_,5,_,3,_,4,_,2,_,3,_,_,_],bass:'x...x.x.x...x.x.',dr:{k:'x...x...x...x...',s:'....x.......x...',h:'x.x.x.x.x.x.x.x.'}},
 sad:{bpm:66,ch:[[45,'m'],[38,'m'],[40,'M'],[45,'m']],lead:'sine',lv:.06,pad:'sine',pv:.025,ml:3,mel:[5,_,_,_,4,_,_,_,3,_,_,_,_,_,_,_,4,_,_,_,3,_,_,_,2,_,_,_,_,_,_,_],bass:'x.......x.......',dr:{k:'',s:'',h:''}}};
function mf(m){return 440*Math.pow(2,(m-69)/12)}
function nt(f,t,d,type,v){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+Math.min(.02,d*.2));g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(MUSG);o.start(t);o.stop(t+d+.05)}
function drm(k,t){if(k==='k'){const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(45,t+.12);g.gain.setValueAtTime(.4,t);g.gain.exponentialRampToValueAtTime(.001,t+.18);o.connect(g);g.connect(MUSG);o.start(t);o.stop(t+.2)}
 else{const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain(),d=k==='h'?.035:.13;s.buffer=NB;f.type=k==='h'?'highpass':'bandpass';f.frequency.value=k==='h'?7000:1800;g.gain.setValueAtTime(k==='h'?.07:.18,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(f);f.connect(g);g.connect(MUSG);s.start(t,Math.random()*.3);s.stop(t+d+.02)}}
function schedStep(st,t){const S=SONGS[MUS.name],spb=60/S.bpm/4,i=st%16,bar=Math.floor(st/16)%S.ch.length,[root,ty]=S.ch[bar],tn=CH[ty];
 if(S.swing&&i%2)t+=spb*S.swing;
 if(i===0)for(const iv of tn)nt(mf(root+12+iv),t,spb*15,S.pad||'triangle',S.pv||.02);
 if(S.bass[i]==='x'){const iv=S.walk?tn[(i/2)%tn.length]:0;nt(mf(root+iv),t,spb*1.7,'triangle',.12)}
 const m=S.mel[st%S.mel.length];if(m!=null){const n=tn[m%tn.length]+12*Math.floor(m/tn.length);nt(mf(root+24+n),t,spb*(S.ml||1.6),S.lead,S.lv||.04)}
 for(const k of ['k','s','h'])if(S.dr[k]&&S.dr[k][i]==='x')drm(k,t)}
setInterval(()=>{if(!AC||!MUSG||MUTE||!MUS.name)return;const S=SONGS[MUS.name],spb=60/S.bpm/4;if(MUS.t<AC.currentTime)MUS.t=AC.currentTime+.05;while(MUS.t<AC.currentTime+.15){schedStep(MUS.step,MUS.t);MUS.t+=spb;MUS.step++}},30);
function playMusic(n){if(MUS.name===n)return;MUS.name=n;MUS.step=0;if(AC)MUS.t=AC.currentTime+.1}
const SFX={
 key:()=>{noise(.035,.07,2500+Math.random()*1500);tone(180+Math.random()*60,.025,'square',.012)},
 step:()=>noise(.07,.07,500,'lowpass'),
 ding:()=>{tone(880,.3,'sine',.07);tone(1320,.4,'sine',.05,0,.09)},
 bad:()=>{tone(180,.35,'sawtooth',.05,80);tone(120,.4,'square',.03,70,.05)},
 beep:()=>tone(1760,.12,'square',.035),
 win:()=>[523,659,784,1047,1319].forEach((f,i)=>tone(f,.3,'triangle',.07,0,i*.085)),
 pop:()=>tone(520,.09,'sine',.07,980),
 chomp:()=>{noise(.09,.09,700,'lowpass');noise(.05,.06,900,'lowpass',.07)},
 whoosh:()=>noise(.3,.05,900,'bandpass'),
 notif:()=>{tone(1046,.12,'sine',.06);tone(1568,.18,'sine',.05,0,.11)},
 tick:()=>tone(2400,.02,'square',.012),
 ring:()=>{for(let i=0;i<3;i++){tone(1300,.06,'square',.018,0,i*.12);tone(1600,.06,'square',.014,0,i*.12+.06)}},
 shutter:()=>{for(let i=0;i<10;i++)noise(.05,.04,1400,'bandpass',i*.07)},
 click:()=>tone(900,.04,'sine',.05,600)
};

// ---------- input
let BTN=[];const PR={};const held=new Map();let scene=null,trans=null;
function toL(e){return{x:(e.clientX*DPR-OX)/SC,y:(e.clientY*DPR-OY)/SC}}
function heldId(id){for(const b of held.values())if(b.id===id)return true;return false}
C.addEventListener('pointerdown',e=>{e.preventDefault();ac();if(trans)return;const p=toL(e);
 for(let i=BTN.length-1;i>=0;i--){const b=BTN[i];if(!b.dis&&p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h){held.set(e.pointerId,b);PR[b.id]=1;if(b.tap)b.tap(p);if(b.down)b.down(p);return}}
 scene&&scene.down&&scene.down(p,e.pointerId)},{passive:false});
C.addEventListener('pointermove',e=>{const p=toL(e);if(e.pointerType==='mouse'){const hit=BTN.some(b=>!b.dis&&p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h);C.style.cursor=hit?'pointer':(scene===SCN.desk&&p.y<540?'grab':'default')}if(held.has(e.pointerId))return;scene&&scene.move&&scene.move(p,e.pointerId)});
function pUp(e){const b=held.get(e.pointerId);if(b){held.delete(e.pointerId);b.up&&b.up()}else{scene&&scene.up&&scene.up(toL(e),e.pointerId)}}
C.addEventListener('pointerup',pUp);C.addEventListener('pointercancel',pUp);
addEventListener('keydown',e=>{if(e.repeat&&e.code!=='Space')return;ac();if(!trans&&scene&&scene.key){if(scene.key(e.code,true))e.preventDefault()}});
addEventListener('keyup',e=>{if(scene&&scene.key)scene.key(e.code,false)});

function button(id,label,x,y,w,h,o={}){
 const p=PR[id]||0,sc=1-.07*p,col=o.col||'#2f80ed',r=o.r==null?Math.min(18,h/2):o.r;
 X.save();X.translate(x+w/2,y+h/2+(o.bounce?Math.sin(TIME*6)*3:0));X.scale(sc,sc);
 if(o.dis)X.globalAlpha*=.42;
 frr(-w/2,-h/2+5,w,h,r,shade(col,-.35));
 frr(-w/2,-h/2+p*3,w,h,r,col);
 X.save();rr(-w/2,-h/2+p*3,w,h,r);X.clip();frr(-w/2,-h/2+p*3,w,h*.45,0,'rgba(255,255,255,.14)');X.restore();
 const sz=o.sz||Math.min(26,h*.4);
 if(o.sub){T(label,0,-sz*.35+p*3,sz,o.tc||'#fff');T(o.sub,0,sz*.62+p*3,sz*.5,'rgba(255,255,255,.8)','center',700)}
 else T(label,0,1+p*3,sz,o.tc||'#fff');
 X.restore();
 BTN.push({id,x,y,w,h,tap:o.tap,down:o.down,up:o.up,dis:o.dis});
}

// ---------- FX / toast / shake
let FX=[],TO=[],SHK=0;
function fx(o){FX.push(Object.assign({t:0,life:1,vx:0,vy:0,g:0,r:0,vr:0,s:6},o))}
const CCOL=['#ff5a5f','#ffd166','#06d6a0','#118ab2','#ef476f','#f78c6b','#9b5de5','#ffffff'];
function confetti(x,y,n=70){for(let i=0;i<n;i++)fx({k:'c',x,y,vx:rnd(-330,330),vy:rnd(-640,-200),g:950,r:rnd(0,6),vr:rnd(-12,12),col:pick(CCOL),life:rnd(1.4,2.6),s:rnd(5,10)})}
function ftxt(x,y,m,col='#fff',sz=26){fx({k:'t',x,y,vy:-55,m,col,sz,life:1.3})}
function updFX(dt){for(const f of FX){f.t+=dt;f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=f.g*dt;f.r+=f.vr*dt;if(f.k==='c'){f.vx*=Math.pow(.4,dt)}}FX=FX.filter(f=>f.t<f.life)}
function drawFX(){for(const f of FX){const a=1-f.t/f.life;X.save();X.globalAlpha=clamp(a*1.5,0,1);X.translate(f.x,f.y);
 if(f.k==='c'){X.rotate(f.r);X.fillStyle=f.col;X.fillRect(-f.s/2,-f.s/4,f.s,f.s/2*Math.abs(Math.cos(f.r*1.7))+1)}
 else if(f.k==='t'){const s=f.t<.15?E.ob(f.t/.15):1;X.scale(s,s);X.lineWidth=5;X.strokeStyle='rgba(0,0,0,.55)';X.font=`900 ${f.sz}px ${FONT}`;X.textAlign='center';X.textBaseline='middle';X.strokeText(f.m,0,0);T(f.m,0,0,f.sz,f.col,'center',900)}
 else if(f.k==='d'){ell(0,0,f.s,f.s,f.col)}
 X.restore()}}
function toast(m,k='info'){TO.push({m,k,t:0,life:k==='phone'?4.2:3.2});if(TO.length>3)TO.shift();if(k==='phone'){SFX.notif();SHK=Math.max(SHK,.35)}}
function drawToasts(dt){let y=(scene&&scene.toastY)?scene.toastY():70;for(const o of TO){o.t+=dt;const a=Math.min(1,o.t/.25,(o.life-o.t)/.35);if(a<=0)continue;const sz=W<560?15:17,mw=Math.min(W-30,520),lines=wrap(o.m,mw-40,sz,800),h=lines.length*(sz+5)+(o.k==='phone'?40:20),w=Math.min(mw,Math.max(...lines.map(l=>TW(l,sz)))+44);
 X.save();X.globalAlpha=a;X.translate(W/2,y+(1-E.oc(a))*-30);
 const bg=o.k==='bad'?'rgba(150,30,40,.94)':o.k==='good'?'rgba(20,110,70,.94)':o.k==='phone'?'rgba(245,245,248,.97)':'rgba(18,22,30,.9)';
 frr(-w/2,0,w,h,16,bg);
 if(o.k==='phone'){T('📱 UBALDO · adesso',-w/2+16,16,12,'#7a7f8a','left',800);lines.forEach((l,i)=>T(l,-w/2+16,36+i*(sz+5),sz,'#15171c','left',800))}
 else lines.forEach((l,i)=>T(l,0,10+sz/2+i*(sz+5),sz,'#fff','center',800));
 X.restore();y+=h+8}TO=TO.filter(o=>o.t<o.life)}

// ---------- transizioni
function go(name,arg){if(trans)return;trans={t:0,name,arg,ph:0};held.clear()}
function setScene(n,a){scene=SCN[n];TO=[];scene.init&&scene.init(a)}
function drawTrans(dt){if(!trans)return;trans.t+=dt/.42;let a;if(trans.ph===0){a=E.io(Math.min(1,trans.t));if(trans.t>=1){setScene(trans.name,trans.arg);trans.ph=1;trans.t=0}}else{a=1-E.io(Math.min(1,trans.t));if(trans.t>=1)trans=null}
 X.fillStyle=`rgba(8,10,14,${a})`;X.fillRect(0,0,W,H)}

// =====================================================================
//  PERSONAGGI
// =====================================================================
const BOSSP={n:'Ubaldo',shirt:'#f4f1ea',jacket:'#2d3e50',tie:'#c0392b',hair:'#7a7a7a',skin:'#eab38f',hs:'bald',fat:1,must:1,pants:'#26313d',seed:3};
const PINA={n:'Pina',shirt:'#f6f6f6',skin:'#f0c39b',hair:'#8a5a3b',hs:'net',apron:1,fat:1,seed:5,pants:'#ddd'};
const MAURO={n:'Mauro',shirt:'#8e44ad',skin:'#e7b98f',hair:'#2d1d12',hs:'short',gl:1,seed:7};

function person(p,x,y,s,o={}){
 if(!(s>0))return;
 X.save();X.translate(x,y);X.scale(s,s);
 if(o.alpha!=null)X.globalAlpha*=clamp(o.alpha,0,1);
 const pose=o.pose||'stand',sit=pose==='sit',walk=pose==='walk',t=TIME+(p.seed||0)*1.7,ph=o.ph||0;
 const tr=o.turn==null?1:o.turn,back=!!o.back||tr<.45;
 const bw=p.fat?46:38,hipY=sit?-40:-46;
 const bob=walk?-Math.abs(Math.sin(ph))*3:(sit&&o.act==='type'?Math.sin(t*15)*.8:Math.sin(t*1.6)*.6);
 const shY=hipY-44+bob,hy=shY-17,sh=p.jacket||p.shirt;
 if(!sit){ell(0,0,bw*.72,6,'rgba(0,0,0,.18)');const sw=walk?Math.sin(ph)*11:0;X.lineCap='round';X.strokeStyle=p.pants||'#2f3542';X.lineWidth=12;X.beginPath();X.moveTo(-9,hipY);X.lineTo(-9+sw,-6);X.moveTo(9,hipY);X.lineTo(9-sw,-6);X.stroke();ell(-9+sw,-4,8,4.5,'#1d1d24');ell(9-sw,-4,8,4.5,'#1d1d24')}
 if(p.hs==='long'&&!back)frr(-17,hy-12,34,40,14,p.hair);
 // busto
